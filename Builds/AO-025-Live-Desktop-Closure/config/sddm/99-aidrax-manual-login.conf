[General]
DisplayServer=x11
GreeterEnvironment=QT_QUICK_BACKEND=software

[Theme]
Current=aidrax

[X11]
# Bypass the distribution convenience symlink so the live image always starts
# the verified Xorg server used by the QEMU VESA configuration.
ServerPath=/usr/local/lib/aidrax/aidrax-xorg-launch
ServerArguments=-nolisten tcp
