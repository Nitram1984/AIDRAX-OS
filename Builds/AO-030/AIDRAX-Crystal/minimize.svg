<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="150"
   height="30"
   viewBox="0 0 150 30"
   version="1.1"
   id="svg28"
   sodipodi:docname="minimize.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview28"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="9.1466667"
     inkscape:cx="19.733965"
     inkscape:cy="15.032799"
     inkscape:window-width="1554"
     inkscape:window-height="1080"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="0"
     inkscape:current-layer="active-center" />
  <defs
     id="defs18">
    <!-- ===== YELLOW NORMAL ===== -->
    <radialGradient
       id="yellowNormal"
       cx="50%"
       cy="25%"
       r="70%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         stop-opacity="0.9"
         id="stop1" />
      <stop
         offset="25%"
         stop-color="#fff27a"
         id="stop2" />
      <stop
         offset="60%"
         stop-color="#e0b400"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#7a5a00"
         id="stop4" />
    </radialGradient>
    <!-- ===== YELLOW HOVER ===== -->
    <radialGradient
       id="yellowHover"
       cx="50%"
       cy="20%"
       r="75%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         stop-opacity="0.95"
         id="stop5" />
      <stop
         offset="30%"
         stop-color="#fff58a"
         id="stop6" />
      <stop
         offset="65%"
         stop-color="#d4a800"
         id="stop7" />
      <stop
         offset="100%"
         stop-color="#6a4f00"
         id="stop8" />
    </radialGradient>
    <!-- ===== YELLOW PRESSED ===== -->
    <radialGradient
       id="yellowPressed"
       cx="50%"
       cy="75%"
       r="80%">
      <stop
         offset="0%"
         stop-color="#fff6a0"
         id="stop9" />
      <stop
         offset="40%"
         stop-color="#c99c00"
         id="stop10" />
      <stop
         offset="100%"
         stop-color="#5a4200"
         id="stop11" />
    </radialGradient>
    <!-- Inner shadow -->
    <radialGradient
       id="innerShadow"
       cx="50%"
       cy="40%"
       r="75%">
      <stop
         offset="60%"
         stop-color="#000000"
         stop-opacity="0"
         id="stop12" />
      <stop
         offset="100%"
         stop-color="#000000"
         stop-opacity="0.55"
         id="stop13" />
    </radialGradient>
    <!-- ===== DARKER GRAY STATES ===== -->
    <radialGradient
       id="grayInactive"
       cx="50%"
       cy="30%"
       r="70%">
      <stop
         offset="0%"
         stop-color="#dcdcdc"
         id="stop14" />
      <stop
         offset="50%"
         stop-color="#8a8a8a"
         id="stop15" />
      <stop
         offset="100%"
         stop-color="#404040"
         id="stop16" />
    </radialGradient>
    <radialGradient
       id="grayDisabled"
       cx="50%"
       cy="35%"
       r="75%">
      <stop
         offset="0%"
         stop-color="#b5b5b5"
         id="stop17" />
      <stop
         offset="100%"
         stop-color="#3a3a3a"
         id="stop18" />
    </radialGradient>
  </defs>
  <!-- cx=15, cy=15, r=13.5 -->
  <!-- ===== 1 NORMAL ===== -->
  <g
     transform="translate(0,0)"
     id="active-center"
     inkscape:label="#active-center">
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="url(#yellowNormal)"
       id="circle18" />
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="none"
       stroke="#5a4200"
       stroke-width="1.2"
       id="circle19" />
  </g>
  <!-- ===== 2 HOVER ===== -->
  <g
     transform="translate(30,0)"
     id="hover-center"
     inkscape:label="#hover-center">
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="url(#yellowHover)"
       id="circle20" />
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="none"
       stroke="#5a4200"
       stroke-width="1.2"
       id="circle21" />
    <!-- Minus -->
    <line
       x1="8"
       y1="15"
       x2="22"
       y2="15"
       stroke="#5a4200"
       stroke-width="3.4"
       stroke-linecap="round"
       id="line21" />
  </g>
  <!-- ===== 3 PRESSED ===== -->
  <g
     transform="translate(60,0)"
     id="pressed-center"
     inkscape:label="#pressed-center">
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="url(#yellowPressed)"
       id="circle22" />
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="url(#innerShadow)"
       id="circle23" />
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="none"
       stroke="#3f2e00"
       stroke-width="1.6"
       id="circle24" />
    <!-- Darker minus -->
    <line
       x1="8.5"
       y1="15"
       x2="21.5"
       y2="15"
       stroke="#3f2e00"
       stroke-width="3.4"
       stroke-linecap="round"
       id="line24" />
  </g>
  <!-- ===== 4 INACTIVE ===== -->
  <g
     transform="translate(90,0)"
     id="inactive-center"
     inkscape:label="#inactive-center">
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="url(#grayInactive)"
       id="circle25" />
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="none"
       stroke="#2f2f2f"
       stroke-width="1.2"
       id="circle26" />
  </g>
  <!-- ===== 5 DISABLED ===== -->
  <g
     transform="translate(120,0)"
     id="deactivated-center"
     inkscape:label="#deactivated-center">
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="url(#grayDisabled)"
       id="circle27" />
    <circle
       cx="15"
       cy="15"
       r="13.5"
       fill="none"
       stroke="#2a2a2a"
       stroke-width="1.2"
       id="circle28" />
  </g>
</svg>
